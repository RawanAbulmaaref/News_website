<!DOCTYPE html>
<html lang="ar" >
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أخبارنا - بوابتك الإخبارية</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/akhbarana.css" />
    <link rel="stylesheet" href="./styles/all.min.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/normalize.css" />
    <link rel="stylesheet" href="./styles/sports.css" />
    <link rel="stylesheet" href="./styles/tricker.css" />
    <link rel="stylesheet" href="./styles/global-economy.css" />
  </head>
  <body>
    <!-- start setting-box -->
    <div class="setting-box">
      <div class="icon">
        <i class="fa fa-bars"></i>
      </div>
      <div class="setting-container">
        <span class="close-x">X</span>

        <div class="setting-text first">
          <div class="option-text">
            <a class="option-span" href="#">الرئيسية</a>
            <i class="fa-solid fa-house"></i>
          </div>
        </div>

        <div class="setting-text">
          <div class="option-text">
            <a class="option-span" href="./pages/sports.html">الرياضة</a>
            <i class="fa-solid fa-futbol"></i>
          </div>
        </div>

        <div class="setting-text">
          <div class="option-text">
            <a class="option-span" href="./pages/economy.html">الاقتصاد</a>
            <i class="fa-solid fa-chart-line"></i>
          </div>
        </div>
      </div>
    </div>

    <nav>
      <div class="left">
        <div class="price"><span>$</span><span id="currency"></span> ج.م</div>
        <div class="time">
          <span id="temp"></span><span id="humidity"></span
          ><span id="description"></span> <span id="city"></span>
        </div>
      </div>
    </nav>
    <div class="center">
      <h1>أخبارنا</h1>
      <p>بوابتك الإخبارية الشاملة</p>

      <div class="line"></div>
    </div>
    <div class="ticker">
      <span class="ticker-label">عاجل</span>
      <div class="ticker-track" id="newsMarquee"></div>
    </div>

    <!-- global economy grid, same block used on pages/economy.html -->
    <section class="container">
      <div class="global">
        <div class="global-title"><p>الاقتصاد العالمي</p></div>
        <section class="global-cards"></section>
      </div>
    </section>

    <!-- slider-->
    <main>
      <section class="container">
        <section class="slider">
          <button id="pre">‹</button>
          <button id="nxt">›</button>
          <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </section>
      </section>
    </main>

    <div class="modal" id="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modal-img" src="" alt="" />
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
      </div>
    </div>
    <section id="sports">
      <div class="sports-container">
        <section class="matches">
          <div class="days-matches">
            <div class="days-btns">
              <button class="matches-btn yesterday-btn">أمس</button>
              <button class="matches-btn today-btn">اليوم</button>
              <button class="matches-btn tommorow-btn">غداً</button>
            </div>
            <div class="matches-view"></div>
          </div>
          <h4>المباريات</h4>
        </section>
        <section class="sports-news-table">
          <div class="sports-news">
            <h4>الاخبار</h4>
            <br />
            <div class="sports-news-cards"></div>
          </div>
          <div class="sports-table">
            <div style="display: flex; justify-content: space-between">
              <h3 style="margin-bottom: 20px">ترتيب الدوري المصري</h3>
              <a href="#"
                ><i class="fa-solid fa-arrow-left" style="color: #155dfc"></i
              ></a>
            </div>
            <div class="teams-table"></div>
          </div>
        </section>
      </div>
    </section>

    <!-- footer-->
    <footer>
      <div class="footer-top">
        <div class="footer-left">
          <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
          <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" aria-label="Github"><i class="fa-brands fa-github"></i></a>
        </div>
        <div class="footer-right">
          <a href="./index.html">الرئيسية <i class="fa-solid fa-house"></i></a>
          <a href="./pages/sports.html">الرياضة <i class="fa-solid fa-trophy"></i></a>
          <a href="./pages/economy.html">الاقتصاد <i class="fa-solid fa-dollar-sign"></i></a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2025 أخبارنا - جميع الحقوق محفوظة</p>
      </div>
    </footer>

    <script src="./scripts/home.js"></script>
    <script src="./scripts/ticker.js"></script>
    <script src="./scripts/global-economy.js"></script>
  </body>
</html>
